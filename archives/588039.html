  <p>时间过得好快，一年又这样过去了。这一年是偶技术增长最慢的一年，也是杂事做的最多的一年，同时，也是挂科开始、最惨烈的一年。</p>
<p>后天就要考电磁场的重修了，我觉得我还没有准备好。在寝室里一个人看书，也怪闷的。开始怀念办公室那种网络环境了。</p>
<p>人要有计划，要有自制力。就是这样咯，努力吧。 <img alt=":)" src="http://wpcache.yo2.cn/wp-includes/images/smilies/icon_smile.gif" /></p>
