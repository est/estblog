<p>据新浪网<a href="http://news.sina.com.cn/c/p/2007-10-25/173814163669.shtml">报道</a>：</p>
<blockquote>
<p>10月24日18时5分，我国在西昌卫星发射中心用长征三号甲运载火箭将嫦娥一号成功送入太空。搭载嫦娥一号卫星的长征三号甲运载火箭一级残骸在24日18时16分安全按计划坠落在预定范围，由于ZF有关部门部署精密，疏散到位，没有造成任何人员伤亡。</p>
