  <header class="post-header">
    <h2 class="post-title">freenode原来还有亚洲镜像的</h2>
    <p class="post-date">Posted <time datetime="2007-09-10T00:00:00+08:00">2007-09-10</time> | <span>archive</span></p>
  </header>

  
  <p>以前一直用 <a href="irc://irc.freenode.net/">irc.freenode.net</a>，由于CERNET出国很慢，所以用得不爽，今天无意中发现FreeNode官站上有<a href="http://freenode.net/irc_servers.shtml">IRC服务器列表</a>，和大陆最近的是台湾桃园的一个服务器，地址是 <a href="irc://tolkien.freenode.net/">tolkien.freenode.net</a> ，，测试了下和电子科大（四川成都）的延迟是380ms左右，以后就用这个了。</p>
<p>另外，FreeNode也可以<a href="http://freenode.net/irc_servers.shtml#tor">通过TOR来访问</a>，有一个秘密节点。</p>
