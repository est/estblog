  <header class="post-header">
    <h2 class="post-title">百度老年搜索手写输入也没啥新鲜的吧</h2>
    <p class="post-date">Posted <time datetime="2009-10-23T19:49:51+08:00">2009-10-23</time> | <span>archive</span></p>
  </header>

  
  <p>百度老年搜索的手写笔画输入，类似的东西n年前就有了。见<a href="http://www.nciku.com/">nciku</a>。</p>
<p><img alt="" src="http://image-001.yo2cdn.com/wp-content/uploads/74/7487/2009/10/111.jpg" /></p>
<p>之所以不说百度抄袭nciku，是因为我不能确定nciku是否也借鉴了类似的。nciku是棒子的网站，那个Flash其实是做的 <a href="http://en.wikipedia.org/wiki/Hanja">Hanja</a> 输入。</p>
<p>值得一提的是，百度继承了悠久的山寨臭毛病，采用的应该是GBK编码，似乎不支持Unicode超大字符集的汉字笔画输入。</p>
<p><img alt="" src="http://image-001.yo2cdn.com/wp-content/uploads/74/7487/2009/10/24.jpg" /></p>
