  <header class="post-header">
    <h2 class="post-title">proftpd配置必备的4个选项</h2>
    <p class="post-date">Posted <time datetime="2007-12-29T16:19:34+08:00">2007-12-29</time> | <span>archive</span></p>
  </header>

  
  <p><code>UseUTF8 Off
DefaultTransferMode binary
UseReverseDNS off
IdentLookups off</code><br />
这样写可以避免很多兼容性问题，兼容性问题是要出人命的，阿弥陀佛！</p>
<p>前两个个可以解决中文目录名乱码问题，后者可以解决<a href="http://www.proftpd.org/docs/faq/faq_full.html#AEN341">proftpd登录超级慢</a>的问题</p>
<p>另外，vsftpd虽然小巧，但是编码问题没法解决！</p>
