  <p><img alt="" src="/Blog/Attachment/618" /></p>
<p>可以看到， Paste 是灰色的，用 Ctrl+V 也没有用。解决方法是：用 Shift+Insert 来粘贴</p>
<p>对应按键：</p>
<p>Ctrl+X Shift+Del</p>
<p>Ctrl+C Alt+Insert</p>
<p>Ctrl+V Shift+Insert</p>
<p>其中Shift+Del要小心，因为在 资源管理器 里 Shift+Del的意思是：不可恢复的删除</p>
