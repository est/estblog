    <h2 class="post-title">DrCom的一个bug</h2>
    <p class="post-date">Posted <time datetime="2007-01-01T22:14:00+08:00">2007-01-01</time> | <span>archive</span></p>
  </header>

  
  <p>今天用Vista，无线可以用DrCom登陆，但是切换到 本地连接 就不能登陆了，提示 “登陆超时”。我把 无线网路 禁用了也没用。于是，把DrCom删除了重装，正常了，原来DrCom不能正确识别通过那个可用的连接来登陆验证服务器。如果我同时脸上了 Wired LAN, Wireless LAN, PPPoE, VPN，恐怕DrCom就不知所措了，^_^</p>
